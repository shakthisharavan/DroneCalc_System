name: Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - css/**
      - js/**
      - fonts/**
      - icons/**
      - sw.js
      - manifest.webmanifest
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # A stale sw.js (SHELL or CACHE_VERSION) must never deploy: fix with `node tests/pwa.test.mjs --bump`.
      - name: Check the service worker is current
        run: node tests/pwa.test.mjs
      - name: Copy the site files
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js fonts icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
